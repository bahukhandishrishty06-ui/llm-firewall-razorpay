version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "8501:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    volumes:
      - ./db:/app/db
    restart: unless-stopped
